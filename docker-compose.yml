name: yavar

services:
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: sh -c "python manage.py migrate && python manage.py seed_capabilities && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-development-only-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-yavar}
      POSTGRES_USER: ${POSTGRES_USER:-yavar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yavar}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      PROVIDER_MODE: ${PROVIDER_MODE:-sandbox}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A config worker --loglevel=info
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A config beat --loglevel=info
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      # Beat's database scheduler needs the migrations applied by the backend
      # service on startup.
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    build:
      context: ./automation/browser
      dockerfile: ../../docker/browser.Dockerfile
    init: true
    volumes:
      - ./automation/browser:/app

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yavar}
      POSTGRES_USER: ${POSTGRES_USER:-yavar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yavar}
    ports:
      # Published on 5433 to avoid clashing with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yavar} -d ${POSTGRES_DB:-yavar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next_cache:
