[project]
name = "yavar-backend"
version = "0.1.0"
description = "Yavar backend (Django modular monolith)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "celery[redis]>=5.6,<5.7",
    "django-celery-beat>=2.8",
    "redis>=5.2",
    "pydantic>=2.11",
    "jdatetime>=5.2",
    "httpx>=0.28",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.12",
    "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = ["E501", "DJ008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
